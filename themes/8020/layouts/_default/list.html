{{ define "main" }}
<div class="content-page">
  <h1>{{ .Title }}</h1>

  {{ if .IsSection }}
    <p class="section-desc">Everything, newest first.</p>
  {{ else if .IsPage }}
  {{ else }}
    <p class="section-desc">Posts tagged <strong>{{ .Title }}</strong></p>
  {{ end }}

  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    <article class="post-item">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <div class="post-tags">
        {{ range .Params.tags }}
          <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/" class="post-tag">{{ . }}</a>
        {{ end }}
      </div>
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
