<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="stylesheet" href="/pagefind/pagefind-ui.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="{{ .Site.BaseURL }}" class="site-title">{{ .Site.Title }}</a>
      <div class="nav-links">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
        <button class="search-toggle" id="search-toggle" aria-label="Search">🔍</button>
      </div>
    </nav>
    <div class="search-container" id="search-container">
      <div id="search"></div>
    </div>
  </header>
  <script src="/pagefind/pagefind-ui.js" onload="new PagefindUI({ element: '#search', showSubResults: true })"></script>
  <script>
    document.getElementById('search-toggle').addEventListener('click', function() {
      var container = document.getElementById('search-container');
      container.classList.toggle('visible');
      if (container.classList.contains('visible')) {
        container.querySelector('input')?.focus();
      }
    });
  </script>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      {{ range .Site.Params.footer.links }}
        <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
      {{ end }}
    </div>
    <p class="footer-copy">&copy; {{ now.Year }} {{ .Site.Params.author }}</p>
  </footer>
</body>
</html>
