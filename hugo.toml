baseURL = 'https://8020workshop.com/'
languageCode = 'en-au'
title = 'The 80-20 Workshop'
theme = '8020'

[params]
  description = "Optimised builds. Minimal waste. Maximum learning."
  author = "Michael Borck"
  tagline = "I go deep on whatever has my attention. The thread connecting it all is the 80-20 philosophy: 80% of the result from 20% of the effort — and for most of us, that's plenty."

[params.footer]
  links = [
    { name = "michaelborck.dev", url = "https://michaelborck.dev" },
    { name = "retroverse.studio", url = "https://retroverse.studio" },
    { name = "theAmalgam.com", url = "https://theamalgam.com" },
  ]

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

